<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armanetti Alineaciones | Turnos Reales</title>
    <link rel="icon" type="image/jpeg" href="andresrojo.jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary-red: #cc0000; --dark-bg: #0a0a0a; --card-bg: #151515; --text-light: #f4f4f9; --accent-green: #25d366; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-light); display: flex; flex-direction: column; align-items: center; padding: 10px; }
        .container { width: 100%; max-width: 450px; }
        header { text-align: center; padding: 20px; }
        .logo-img { width: 200px; filter: drop-shadow(0px 4px 10px rgba(204,0,0,0.3)); }
        .booking-card { background: var(--card-bg); padding: 25px; border-radius: 25px; border-top: 4px solid var(--primary-red); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.8rem; color: var(--primary-red); font-weight: bold; }
        input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #202020; color: white; }
        .btn-whatsapp { width: 100%; background: var(--accent-green); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .loading { font-size: 0.8rem; color: #888; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="container">
    <header><img src="andresrojo.jpeg" class="logo-img"></header>

    <div class="booking-card">
        <div class="form-group">
            <label>Nombre Completo</label>
            <input type="text" id="nombre" placeholder="Tu nombre">
        </div>
        <div class="form-group">
            <label>Fecha</label>
            <input type="date" id="fecha" onchange="cargarHorasDisponibles()">
        </div>
        <div class="form-group">
            <label>Hora Disponible</label>
            <select id="hora"><option value="">Seleccione fecha</option></select>
            <div id="loader" class="loading">Consultando disponibilidad...</div>
        </div>
        <button class="btn-whatsapp" onclick="agendarTurno()">AGENDAR TURNO</button>
    </div>
</div>

<script>
    const SCRIPT_URL = https://script.google.com/macros/s/AKfycbzINUneirUvVix6s3W9-gF1tJzwZxa367ZOBuG3bm2aBvk5UQiQsSX7_JG-3SXLhu9DHw/exec; // <--- PEGA AQUÍ TU URL
    let ocupados = [];

    async function cargarHorasDisponibles() {
        const fecha = document.getElementById('fecha').value;
        const select = document.getElementById('hora');
        const loader = document.getElementById('loader');
        if(!fecha) return;

        select.innerHTML = '<option>Cargando...</option>';
        loader.style.display = 'block';

        try {
            const res = await fetch(SCRIPT_URL);
            ocupados = await res.json();
            
            select.innerHTML = '';
            const fechaSel = new Date(fecha + "T00:00:00");
            const dia = fechaSel.getDay();
            
            if(dia === 0) { select.innerHTML = '<option>Cerrado</option>'; return; }

            let horas = (dia === 6) ? [7,8,9,10,11,12] : [7,8,9,10,11,13,14,15,16,17];
            
            horas.forEach(h => {
                let hf = (h < 10 ? '0'+h : h) + ':00 hs';
                let idTurno = fecha + "_" + hf;
                if(!ocupados.includes(idTurno)) {
                    let opt = document.createElement('option');
                    opt.value = hf; opt.text = hf; select.appendChild(opt);
                }
            });
            if(select.innerHTML === '') select.innerHTML = '<option>Sin turnos libres</option>';
        } catch(e) { alert("Error al consultar turnos"); }
        loader.style.display = 'none';
    }

    async function agendarTurno() {
        const btn = document.querySelector('.btn-whatsapp');
        const datos = {
            nombre: document.getElementById('nombre').value,
            servicio: "Mecánica",
            fecha: document.getElementById('fecha').value,
            hora: document.getElementById('hora').value,
            telefono: "Cliente Web"
        };

        if(!datos.nombre || !datos.fecha || !datos.hora) return alert("Completa los datos");

        btn.disabled = true; btn.innerText = "PROCESANDO...";

        await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(datos)
        });

        const msg = `Hola Andres, soy ${datos.nombre}. Agendé turno para el ${datos.fecha} a las ${datos.hora}.`;
        window.open(`https://wa.me/59895738828?text=${encodeURIComponent(msg)}`, '_blank');
        location.reload();
    }

    document.getElementById('fecha').min = new Date().toISOString().split("T")[0];
</script>
</body>
</html>
