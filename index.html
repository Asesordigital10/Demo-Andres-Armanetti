<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armanetti Alineaciones | Turnos Online</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="andresalineacion(1).png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary-red: #cc0000; /* Rojo Armanetti */
            --silver-metal: #a6a6a6;
            --google-blue: #4285F4;
            --dark-bg: #0a0a0a;
            --card-bg: #151515;
            --text-light: #f4f4f9;
            --accent-green: #25d366;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }

        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            display: flex; flex-direction: column; align-items: center;
            padding: 10px;
        }

        .container { width: 100%; max-width: 450px; }

        /* Header con el nuevo Logo */
        header {
            text-align: center;
            padding: 20px 15px;
            background: linear-gradient(180deg, #1a1a1a 0%, var(--dark-bg) 100%);
            border-radius: 25px 25px 0 0;
        }

        .logo-img {
            width: 250px; /* Tamaño optimizado para el logo circular */
            height: auto;
            margin-bottom: 10px;
            filter: drop-shadow(0px 4px 15px rgba(204, 0, 0, 0.3));
        }

        /* TARJETA DE GOOGLE MAPS - ALTA VISIBILIDAD */
        .maps-card {
            background: #ffffff;
            border-radius: 15px;
            margin: 0 10px 25px 10px;
            display: flex;
            align-items: center;
            padding: 15px;
            text-decoration: none;
            color: #333;
            border: 3px solid var(--google-blue);
            box-shadow: 0 10px 20px rgba(66, 133, 244, 0.3);
            transition: transform 0.2s;
        }
        .maps-card:active { transform: scale(0.97); }

        .maps-icon {
            background: var(--google-blue);
            color: white;
            width: 50px; height: 50px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; margin-right: 15px;
            flex-shrink: 0;
        }

        .maps-info strong { display: block; font-size: 1rem; color: #1a1a1a; }
        .maps-info span { font-size: 0.85rem; color: var(--google-blue); font-weight: 800; text-transform: uppercase; }

        /* Formulario de Turnos */
        .booking-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 25px;
            border: 1px solid #2d2d2d;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            border-top: 4px solid var(--primary-red);
        }

        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-size: 0.8rem; color: var(--primary-red); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        
        input, select {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #333;
            background: #202020;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        input:focus, select:focus { border-color: var(--primary-red); }

        .btn-whatsapp {
            width: 100%;
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 12px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            text-transform: uppercase;
        }

        .btn-whatsapp:active { transform: scale(0.98); }

        .tech-box {
            margin-top: 20px;
            text-align: center;
            padding: 15px;
            background: #1a1a1a;
            border-radius: 20px;
            border: 1px solid #333;
        }
        .tech-box a { color: var(--silver-metal); text-decoration: none; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.9rem; }
        .tech-box i { color: var(--primary-red); }

        footer { margin-top: 30px; padding-bottom: 30px; text-align: center; }
        footer p { font-size: 0.75rem; color: #666; line-height: 1.5; }
        .break-info { color: #fbc02d; font-weight: bold; font-size: 0.75rem; margin-top: 6px; display: block; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <!-- Logo actualizado -->
            <img src="input_file_0.jpeg" alt="Armanetti Alineaciones" class="logo-img">
        </header>

        <!-- Ubicación Google Maps Resaltada -->
        <a href="https://www.google.com/maps/search/?api=1&query=Juan+Jacobo+Rousseau+3784+Montevideo" target="_blank" class="maps-card">
            <div class="maps-icon">
                <i class="fa-solid fa-location-dot"></i>
            </div>
            <div class="maps-info">
                <strong>J. J. Rousseau 3784</strong>
                <span><i class="fa-solid fa-map-location-dot"></i> Cómo llegar con Google Maps</span>
            </div>
        </a>

        <div class="booking-card">
            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> Nombre Completo</label>
                <input type="text" id="nombre" placeholder="Ej: Carlos Rodríguez">
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-screwdriver-wrench"></i> Servicio</label>
                <select id="servicio">
                    <option value="Alineación y Balanceo">Alineación y Balanceo</option>
                    <option value="Tren Delantero/Trasero">Tren Delantero / Trasero</option>
                    <option value="Venta de Cubiertas">Venta de Cubiertas</option>
                    <option value="Mecánica Ligera">Mecánica Ligera</option>
                </select>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-calendar-check"></i> Fecha del Turno</label>
                <input type="date" id="fecha" onchange="generarHoras()">
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-clock"></i> Hora (1 hora de duración)</label>
                <select id="hora">
                    <option value="">Seleccione una fecha</option>
                </select>
                <span class="break-info"><i class="fa-solid fa-mug-hot"></i> Descanso del taller: 12:00 a 13:00 hs</span>
            </div>

            <button class="btn-whatsapp" onclick="enviarTurno()">
                <i class="fa-brands fa-whatsapp"></i> AGENDAR TURNO AHORA
            </button>
        </div>

        <div class="tech-box">
            <a href="https://wa.me/59895738828?text=Hola%20Andres,%20tengo%20una%20consulta%20técnica..." target="_blank">
                <i class="fa-solid fa-user-gear"></i> CONSULTA TÉCNICA CON ANDRÉS
            </a>
        </div>

        <footer>
            <p>
                <strong>Armanetti Alineaciones</strong><br>
                Lunes a Viernes: 07:00 a 18:00 hs<br>
                Sábados: 07:00 a 13:00 hs
            </p>
            <p style="margin-top: 15px; opacity: 0.4;">&copy; 2024 | Desarrollado por Asesor Digital UY</p>
        </footer>
    </div>

    <script>
        function generarHoras() {
            const fechaInput = document.getElementById('fecha').value;
            const horaSelect = document.getElementById('hora');
            const fechaSeleccionada = new Date(fechaInput + "T00:00:00");
            const diaSemana = fechaSeleccionada.getDay(); 

            horaSelect.innerHTML = '';

            if (diaSemana === 0) {
                horaSelect.innerHTML = '<option>Cerrado los Domingos</option>';
                return;
            }

            // Lógica de Horarios: L-V (7-11 y 13-17) | Sáb (7-12)
            if (diaSemana >= 1 && diaSemana <= 5) { 
                for (let h = 7; h <= 11; h++) { agregarOpcion(horaSelect, h); }
                for (let h = 13; h <= 17; h++) { agregarOpcion(horaSelect, h); }
            } else if (diaSemana === 6) { 
                for (let h = 7; h <= 12; h++) { agregarOpcion(horaSelect, h); }
            }
        }

        function agregarOpcion(select, hora) {
            let horaFormateada = (hora < 10 ? '0' + hora : hora) + ':00 hs';
            let option = document.createElement('option');
            option.value = horaFormateada;
            option.text = horaFormateada;
            select.appendChild(option);
        }

        function enviarTurno() {
            const tel = "59895738828";
            const nombre = document.getElementById('nombre').value;
            const servicio = document.getElementById('servicio').value;
            const fecha = document.getElementById('fecha').value;
            const hora = document.getElementById('hora').value;

            if (!nombre || !fecha || !hora || hora.includes("Seleccione")) {
                alert("Por favor, completa tu nombre, fecha y hora.");
                return;
            }

            const mensaje = `Hola Armanetti Alineaciones, soy *${nombre}*.%0A%0A` +
                            `Solicito un turno para:%0A` +
                            `🛠 *Servicio:* ${servicio}%0A` +
                            `📅 *Fecha:* ${fecha}%0A` +
                            `⏰ *Hora:* ${hora}%0A%0A` +
                            `Confirmame disponibilidad por favor.`;

            window.open(`https://wa.me/${tel}?text=${mensaje}`, '_blank');
        }

        const hoy = new Date().toISOString().split("T")[0];
        document.getElementById('fecha').setAttribute('min', hoy);
    </script>
</body>
</html>
