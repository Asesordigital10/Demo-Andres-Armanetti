
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armanetti Alineaciones | Turnos Online</title>
    <!-- Favicon corregido -->
    <link rel="icon" type="image/jpeg" href="andresrojo.jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary-red: #cc0000;
            --silver-metal: #a6a6a6;
            --google-blue: #4285F4;
            --dark-bg: #0a0a0a;
            --card-bg: #151515;
            --text-light: #f4f4f9;
            --accent-green: #25d366;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            display: flex; flex-direction: column; align-items: center;
            padding: 10px;
        }

        .container { width: 100%; max-width: 450px; }

        header {
            text-align: center;
            padding: 20px 15px;
            background: linear-gradient(180deg, #1a1a1a 0%, var(--dark-bg) 100%);
            border-radius: 25px 25px 0 0;
        }

        .logo-img {
            width: 250px;
            height: auto;
            margin-bottom: 10px;
            filter: drop-shadow(0px 4px 15px rgba(204, 0, 0, 0.3));
        }

        .maps-card {
            background: #ffffff;
            border-radius: 15px;
            margin: 0 10px 25px 10px;
            display: flex;
            align-items: center;
            padding: 15px;
            text-decoration: none;
            color: #333;
            border: 3px solid var(--google-blue);
            box-shadow: 0 10px 20px rgba(66, 133, 244, 0.3);
        }

        .maps-icon {
            background: var(--google-blue);
            color: white;
            width: 50px; height: 50px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; margin-right: 15px;
            flex-shrink: 0;
        }

        .maps-info strong { display: block; font-size: 1rem; color: #1a1a1a; }
        .maps-info span { font-size: 0.85rem; color: var(--google-blue); font-weight: 800; text-transform: uppercase; }

        .booking-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 25px;
            border: 1px solid #2d2d2d;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            border-top: 4px solid var(--primary-red);
        }

        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-size: 0.8rem; color: var(--primary-red); font-weight: bold; text-transform: uppercase; }
        
        input, select {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #333;
            background: #202020;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .btn-whatsapp {
            width: 100%;
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }

        .tech-box {
            margin-top: 20px;
            text-align: center;
            padding: 15px;
            background: #1a1a1a;
            border-radius: 20px;
            border: 1px solid #333;
        }
        .tech-box a { color: var(--silver-metal); text-decoration: none; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; }

        footer { margin-top: 30px; padding-bottom: 30px; text-align: center; }
        footer p { font-size: 0.75rem; color: #666; }
        .break-info { color: #fbc02d; font-weight: bold; font-size: 0.75rem; margin-top: 6px; display: block; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <!-- Nombre de archivo corregido según tu GitHub -->
            <img src="andresrojo.jpeg" alt="Armanetti Alineaciones" class="logo-img">
        </header>

        <a href="https://www.google.com/maps/search/?api=1&query=Juan+Jacobo+Rousseau+3784+Montevideo" target="_blank" class="maps-card">
            <div class="maps-icon"><i class="fa-solid fa-location-dot"></i></div>
            <div class="maps-info">
                <strong>J. J. Rousseau 3784</strong>
                <span>Tocar para abrir Google Maps</span>
            </div>
        </a>

        <div class="booking-card">
            <div class="form-group">
                <label>Nombre Completo</label>
                <input type="text" id="nombre" placeholder="Tu nombre">
            </div>
            <div class="form-group">
                <label>Servicio</label>
                <select id="servicio">
                    <option value="Alineación y Balanceo">Alineación y Balanceo</option>
                    <option value="Tren Delantero/Trasero">Tren Delantero / Trasero</option>
                    <option value="Venta de Cubiertas">Venta de Cubiertas</option>
                    <option value="Mecánica Ligera">Mecánica Ligera</option>
                </select>
            </div>
            <div class="form-group">
                <label>Fecha</label>
                <input type="date" id="fecha" onchange="generarHoras()">
            </div>
            <div class="form-group">
                <label>Hora</label>
                <select id="hora"><option value="">Seleccione fecha</option></select>
                <span class="break-info">Descanso: 12:00 a 13:00 hs</span>
            </div>
            <button class="btn-whatsapp" onclick="enviarTurno()">
                <i class="fa-brands fa-whatsapp"></i> AGENDAR TURNO
            </button>
        </div>

        <div class="tech-box">
            <a href="https://wa.me/59895738828?text=Hola%20Andres" target="_blank">
                <i class="fa-solid fa-user-gear"></i> CONSULTA TÉCNICA
            </a>
        </div>

        <footer>
            <p>Armanetti Alineaciones<br>L-V: 07 a 18 | S: 07 a 13</p>
        </footer>
    </div>

    <script>
        function generarHoras() {
            const fechaInput = document.getElementById('fecha').value;
            const horaSelect = document.getElementById('hora');
            const fechaSeleccionada = new Date(fechaInput + "T00:00:00");
            const diaSemana = fechaSeleccionada.getDay(); 
            horaSelect.innerHTML = '';
            if (diaSemana === 0) { horaSelect.innerHTML = '<option>Cerrado</option>'; return; }
            if (diaSemana >= 1 && diaSemana <= 5) { 
                for (let h = 7; h <= 11; h++) { agregarOpcion(horaSelect, h); }
                for (let h = 13; h <= 17; h++) { agregarOpcion(horaSelect, h); }
            } else { 
                for (let h = 7; h <= 12; h++) { agregarOpcion(horaSelect, h); }
            }
        }
        function agregarOpcion(select, h) {
            let hf = (h < 10 ? '0' + h : h) + ':00 hs';
            let opt = document.createElement('option');
            opt.value = hf; opt.text = hf; select.appendChild(opt);
        }
        function enviarTurno() {
            const tel = "59895738828";
            const n = document.getElementById('nombre').value;
            const s = document.getElementById('servicio').value;
            const f = document.getElementById('fecha').value;
            const h = document.getElementById('hora').value;
            if (!n || !f || !h) { alert("Completa los datos"); return; }
            const msg = `Hola, soy *${n}*. Turno para: ${s} el ${f} a las ${h}.`;
            window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`, '_blank');
        }
        document.getElementById('fecha').min = new Date().toISOString().split("T")[0];
    </script>
</body>
</html>
