<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armanetti Alineaciones | Turnos Online</title>
    <link rel="icon" type="image/jpeg" href="andresrojo.jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --red: #cc0000;
            --google-blue: #4285F4;
            --dark-bg: #0a0a0a;
            --card-bg: #151515;
            --text-light: #f4f4f9;
            --accent-green: #25d366;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            display: flex; flex-direction: column; align-items: center;
            padding: 10px;
        }

        .container { width: 100%; max-width: 450px; }

        header { text-align: center; padding: 20px 15px; }
        .logo-img { width: 220px; filter: drop-shadow(0px 4px 15px rgba(204, 0, 0, 0.4)); }

        .maps-card {
            background: #ffffff; border-radius: 15px; margin: 0 10px 25px 10px;
            display: flex; align-items: center; padding: 15px; text-decoration: none;
            color: #333; border: 3px solid var(--google-blue);
            box-shadow: 0 8px 15px rgba(0,0,0,0.5);
        }

        .booking-card {
            background: var(--card-bg); padding: 25px; border-radius: 25px;
            border: 1px solid #2d2d2d; border-top: 4px solid var(--red);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-size: 0.8rem; color: var(--red); font-weight: bold; text-transform: uppercase; }
        
        input, select {
            width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #333;
            background: #202020; color: white; font-size: 1rem; outline: none;
        }

        .btn-whatsapp {
            width: 100%; background-color: var(--accent-green); color: white;
            border: none; padding: 18px; border-radius: 15px; font-weight: 900;
            font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px;
            margin-top: 10px;
        }
        .btn-whatsapp:disabled { background-color: #444; opacity: 0.6; }

        .loading-text { font-size: 0.75rem; color: #fbc02d; display: none; margin-top: 5px; text-align: center; font-weight: bold; }
        .break-info { color: #888; font-size: 0.75rem; margin-top: 8px; display: block; text-align: center; }

        footer { margin-top: 30px; padding-bottom: 30px; text-align: center; font-size: 0.75rem; color: #666; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <img src="andresrojo.jpeg" alt="Armanetti Alineaciones" class="logo-img">
        </header>

        <a href="https://www.google.com/maps/search/?api=1&query=Juan+Jacobo+Rousseau+3784+Montevideo" target="_blank" class="maps-card">
            <div style="background:var(--google-blue); color:white; width:45px; height:45px; border-radius:10px; display:flex; align-items:center; justify-content:center; margin-right:15px; flex-shrink:0;">
                <i class="fa-solid fa-location-dot"></i>
            </div>
            <div>
                <strong style="display:block; color: #111;">J. Rousseau 3784</strong>
                <span style="font-size:0.8rem; color:var(--google-blue); font-weight: bold;">ABRIR GOOGLE MAPS</span>
            </div>
        </a>

        <div class="booking-card">
            <div class="form-group">
                <label>Nombre Completo</label>
                <input type="text" id="nombre" placeholder="Ej: Juan Pérez">
            </div>

            <div class="form-group">
                <label>Servicio</label>
                <select id="servicio">
                    <option>Alineación y Balanceo</option>
                    <option>Tren Delantero/Trasero</option>
                    <option>Venta de Cubiertas</option>
                    <option>Mecánica Ligera</option>
                </select>
            </div>

            <div class="form-group">
                <label>Seleccionar Fecha</label>
                <input type="date" id="fecha" onchange="generarHoras()">
            </div>

            <div class="form-group">
                <label>Hora Disponible</label>
                <select id="hora">
                    <option value="">Seleccione una fecha</option>
                </select>
                <div id="loading" class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> Sincronizando agenda...</div>
                <span class="break-info">Descanso: 12:00 a 13:00 hs</span>
            </div>

            <button id="btnEnviar" class="btn-whatsapp" onclick="enviarTurno()">
                <i class="fa-brands fa-whatsapp"></i> AGENDAR TURNO
            </button>
        </div>

        <footer>
            <p>Armanetti Alineaciones | Montevideo<br>L-V: 07 a 18 | S: 07 a 13</p>
        </footer>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxOliTmaS-zc7UFwhA7IGvrZEcGLSseU7vJUMd0LLKMH1W5JTujB1ADNWeq4OIwc2XnQw/exec"; 

        async function generarHoras() {
            const fechaInput = document.getElementById('fecha').value;
            const horaSelect = document.getElementById('hora');
            const loading = document.getElementById('loading');
            
            if (!fechaInput) return;

            // 1. Mostrar todas las horas inmediatamente
            horaSelect.innerHTML = '';
            const diaSemana = new Date(fechaInput + "T00:00:00").getDay(); 

            if (diaSemana === 0) {
                horaSelect.innerHTML = '<option>Cerrado los Domingos</option>';
                return;
            }

            let horasBase = (diaSemana >= 1 && diaSemana <= 5) 
                ? [7, 8, 9, 10, 11, 13, 14, 15, 16, 17] 
                : [7, 8, 9, 10, 11, 12];

            horasBase.forEach(h => {
                const hf = (h < 10 ? '0' + h : h) + ':00 hs';
                const option = document.createElement('option');
                option.value = hf;
                option.text = hf;
                horaSelect.appendChild(option);
            });

            // 2. Consultar a Google para FILTRAR las ocupadas
            loading.style.display = "block";
            try {
                const resp = await fetch(SCRIPT_URL + "?t=" + new Date().getTime());
                const ocupados = await resp.json();
                
                // Limpiamos los ocupados para comparar sin errores (minúsculas y sin espacios)
                const ocupadosLimpios = ocupados.map(o => o.toLowerCase().replace(/\s/g, ""));

                Array.from(horaSelect.options).forEach(opt => {
                    const llaveWeb = (fechaInput + "_" + opt.value).toLowerCase().replace(/\s/g, "");
                    if (ocupadosLimpios.includes(llaveWeb)) {
                        opt.remove();
                    }
                });
            } catch (e) {
                console.log("Error de conexión, se muestran todas las horas.");
            }
            loading.style.display = "none";
            if (horaSelect.innerHTML === '') horaSelect.innerHTML = '<option>Sin turnos libres</option>';
        }

        async function enviarTurno() {
            const nombre = document.getElementById('nombre').value;
            const servicio = document.getElementById('servicio').value;
            const fecha = document.getElementById('fecha').value;
            const hora = document.getElementById('hora').value;
            const btn = document.getElementById('btnEnviar');

            if (!nombre || !fecha || !hora || hora.includes("Seleccione") || hora.includes("Sin turnos")) {
                alert("Por favor, completa todos los campos.");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> AGENDANDO...';

            try {
                // Guardar en Google Sheets
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ nombre, servicio, fecha, hora })
                });

                // Formatear fecha para WhatsApp (DD/MM/YYYY)
                const fechaWpp = fecha.split('-').reverse().join('/');

                const mensaje = `Hola Armanetti Alineaciones, soy *${nombre}*.%0A%0A` +
                                `Agendé turno para: *${servicio}*%0A` +
                                `📅 Fecha: *${fechaWpp}*%0A` +
                                `⏰ Hora: *${hora}*`;

                window.open(`https://wa.me/59895738828?text=${mensaje}`, '_blank');
                
                setTimeout(() => { location.reload(); }, 2500);

            } catch (e) {
                alert("Error al agendar. Intenta de nuevo.");
                btn.disabled = false;
                btn.innerHTML = 'AGENDAR TURNO';
            }
        }

        document.getElementById('fecha').min = new Date().toISOString().split("T")[0];
    </script>
</body>
</html>
