<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armanetti Alineaciones | Turnos</title>
    <link rel="icon" type="image/jpeg" href="andresrojo.jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --red: #cc0000; --bg: #0a0a0a; --card: #151515; --text: #f4f4f9; --green: #25d366; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; padding: 10px; }
        .container { width: 100%; max-width: 450px; }
        header { text-align: center; padding: 20px; }
        .logo-img { width: 200px; filter: drop-shadow(0 0 10px rgba(204,0,0,0.4)); }
        .booking-card { background: var(--card); padding: 25px; border-radius: 20px; border-top: 4px solid var(--red); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.8rem; color: var(--red); font-weight: bold; }
        input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #202020; color: white; font-size: 1rem; }
        .btn-whatsapp { width: 100%; background: var(--green); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 10px; }
        .loading-text { font-size: 0.7rem; color: #fbc02d; display: none; margin-top: 5px; }
        .maps-btn { background: white; color: #333; display: flex; align-items: center; padding: 12px; border-radius: 15px; text-decoration: none; margin-bottom: 20px; border: 2px solid #4285F4; }
    </style>
</head>
<body>

<div class="container">
    <header><img src="andresrojo.jpeg" class="logo-img"></header>

    <a href="https://www.google.com/maps/search/?api=1&query=Juan+Jacobo+Rousseau+3784+Montevideo" target="_blank" class="maps-btn">
        <i class="fa-solid fa-location-dot" style="color:#4285F4; font-size: 1.5rem; margin-right: 15px;"></i>
        <div><strong>J. J. Rousseau 3784</strong><br><small>Abrir en Google Maps</small></div>
    </a>

    <div class="booking-card">
        <div class="form-group">
            <label>Nombre Completo</label>
            <input type="text" id="nombre" placeholder="Tu nombre">
        </div>
        <div class="form-group">
            <label>Servicio</label>
            <select id="servicio">
                <option>Alineación y Balanceo</option>
                <option>Tren Delantero/Trasero</option>
                <option>Venta de Cubiertas</option>
                <option>Mecánica Ligera</option>
            </select>
        </div>
        <div class="form-group">
            <label>Fecha</label>
            <input type="date" id="fecha" onchange="actualizarHoras()">
        </div>
        <div class="form-group">
            <label>Hora Disponible</label>
            <select id="hora"><option value="">Selecciona una fecha</option></select>
            <div id="loading" class="loading-text">Verificando agenda...</div>
        </div>
        <button id="btn" class="btn-whatsapp" onclick="enviar()">AGENDAR TURNO</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw1Hfbr3WkZcDg3BjbWUve6xVJSUTwPd13VN5nhP6xhbfMG-IU6q-b1bok_lvHeuE8qsw/exec";

    async function actualizarHoras() {
        const fecha = document.getElementById('fecha').value;
        const select = document.getElementById('hora');
        const loading = document.getElementById('loading');
        if (!fecha) return;

        // 1. Mostrar horas inmediatamente (Modo Seguro)
        select.innerHTML = '';
        const dia = new Date(fecha + "T00:00:00").getDay();
        if (dia === 0) { select.innerHTML = '<option>Cerrado Domingos</option>'; return; }
        
        let horasBase = (dia === 6) ? [7,8,9,10,11,12] : [7,8,9,10,11,13,14,15,16,17];
        horasBase.forEach(h => {
            let hf = (h < 10 ? '0'+h : h) + ':00 hs';
            let opt = document.createElement('option');
            opt.value = hf; opt.text = hf;
            select.appendChild(opt);
        });

        // 2. Intentar filtrar ocupados desde Google
        loading.style.display = "block";
        try {
            const res = await fetch(SCRIPT_URL + "?t=" + new Date().getTime());
            const ocupados = await res.json();
            
            // Filtrar las opciones que ya están en el JSON
            Array.from(select.options).forEach(opt => {
                if (ocupados.includes(fecha + "_" + opt.value)) {
                    opt.remove();
                }
            });
        } catch (e) {
            console.log("No se pudo conectar con la base de datos, usando modo offline.");
        }
        loading.style.display = "none";
        if (select.innerHTML === '') select.innerHTML = '<option>Sin turnos libres</option>';
    }

    async function enviar() {
        const n = document.getElementById('nombre').value;
        const s = document.getElementById('servicio').value;
        const f = document.getElementById('fecha').value;
        const h = document.getElementById('hora').value;
        const btn = document.getElementById('btn');

        if (!n || !f || !h || h.includes("Selecciona") || h.includes("Cerrado")) {
            alert("Completa todos los campos"); return;
        }

        btn.disabled = true;
        btn.innerText = "REGISTRANDO...";

        try {
            // Registro en Google (en segundo plano)
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ nombre: n, servicio: s, fecha: f, hora: h, telefono: "Web" })
            });

            // Abrir WhatsApp
            const msg = `Hola Armanetti Alineaciones, soy *${n}*. Agendé turno para *${s}* el ${f} a las ${h}.`;
            window.open(`https://wa.me/59895738828?text=${encodeURIComponent(msg)}`, '_blank');
            
            setTimeout(() => { location.reload(); }, 2000);
        } catch (e) {
            alert("Error al agendar");
            btn.disabled = false;
        }
    }

    // Fecha mínima hoy
    document.getElementById('fecha').min = new Date().toISOString().split("T")[0];
</script>
</body>
</html>
