<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andres Armanetti | Alineación y Balanceo</title>
    <!-- Favicon con tu logo -->
    <link rel="icon" type="image/png" href="andresalineacionrojo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary-blue: #0056b3;
            --dark-bg: #0f1113;
            --card-bg: #1a1d21;
            --text-light: #f4f4f9;
            --accent-green: #25d366;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }

        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            display: flex; flex-direction: column; align-items: center;
            padding: 10px;
        }

        .container { width: 100%; max-width: 450px; }

        /* Header */
        header {
            text-align: center;
            padding: 35px 15px;
            background: linear-gradient(180deg, #16191c 0%, var(--dark-bg) 100%);
            border-radius: 25px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary-blue);
        }

        .logo-img {
            width: 200px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.5));
        }

        header h1 { font-size: 1.5rem; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 5px; }
        
        /* Enlace de Dirección (Google Maps) */
        .address-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-blue);
            text-decoration: none;
            font-size: 0.9rem;
            background: rgba(0, 86, 179, 0.1);
            padding: 10px 18px;
            border-radius: 50px;
            margin-top: 10px;
            border: 1px solid rgba(0, 86, 179, 0.3);
            transition: 0.3s;
        }
        .address-link:active { background: var(--primary-blue); color: white; }

        /* Tarjeta de Turnos */
        .booking-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 25px;
            border: 1px solid #2d3238;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.8rem; color: var(--primary-blue); font-weight: bold; text-transform: uppercase; }
        
        select, input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #3e444d;
            background: #252a30;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .btn-whatsapp {
            width: 100%;
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 12px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        /* Contacto Técnico */
        .tech-box {
            margin-top: 25px;
            text-align: center;
            padding: 20px;
            background: #16191c;
            border-radius: 20px;
            border: 1px solid #2d3238;
        }
        .tech-box p { font-size: 0.85rem; color: #888; margin-bottom: 10px; }
        .tech-box a { color: #00a8ff; text-decoration: none; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; }

        footer { margin-top: 40px; padding-bottom: 30px; text-align: center; }
        footer p { font-size: 0.75rem; color: #555; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <img src="andresalineacion.png" alt="Andres Armanetti" class="logo-img">
            <h1>Andres Armanetti</h1>
            <p>Alineación • Balanceo • Tren Delantero • Cubiertas</p>
            
            <!-- Link a Google Maps -->
            <a href="https://www.google.com/maps/search/?api=1&query=Juan+Jacobo+Rousseau+3784+Montevideo" target="_blank" class="address-link">
                <i class="fa-solid fa-location-dot"></i> J. J. Rousseau 3784, Montevideo
            </a>
        </header>

        <div class="booking-card">
            <div class="form-group">
                <label>Servicio Requerido</label>
                <select id="servicio">
                    <option value="Alineación y Balanceo">Alineación y Balanceo</option>
                    <option value="Tren Delantero/Trasero">Tren Delantero / Trasero</option>
                    <option value="Venta de Cubiertas">Venta de Cubiertas</option>
                    <option value="Mecánica Ligera">Mecánica Ligera</option>
                </select>
            </div>

            <div class="form-group">
                <label>Fecha del Turno</label>
                <input type="date" id="fecha" onchange="generarHoras()">
            </div>

            <div class="form-group">
                <label>Hora Disponible</label>
                <select id="hora">
                    <option value="">Seleccione una fecha</option>
                </select>
            </div>

            <button class="btn-whatsapp" onclick="enviarTurno()">
                <i class="fa-brands fa-whatsapp"></i> AGENDAR POR WHATSAPP
            </button>
        </div>

        <div class="tech-box">
            <p>¿Dudas sobre un repuesto o falla?</p>
            <a href="https://wa.me/59895738828?text=Hola%20Andres,%20tengo%20una%20consulta%20técnica..." target="_blank">
                <i class="fa-solid fa-screwdriver-wrench"></i> HABLAR CON EL TÉCNICO
            </a>
        </div>

        <footer>
            <p>
                Horario de Atención:<br>
                Lunes a Viernes: 07:00 a 18:00 hs<br>
                Sábados: 07:00 a 13:00 hs
            </p>
            <p style="margin-top: 15px; opacity: 0.5;">&copy; 2024 Andres Armanetti | Asesor Digital UY</p>
        </footer>
    </div>

    <script>
        // Configuración de Horarios de Turnos
        function generarHoras() {
            const fechaInput = document.getElementById('fecha').value;
            const horaSelect = document.getElementById('hora');
            const fechaSeleccionada = new Date(fechaInput + "T00:00:00");
            const diaSemana = fechaSeleccionada.getDay(); // 0=Dom, 1=Lun, 6=Sab

            horaSelect.innerHTML = '';

            if (diaSemana === 0) {
                horaSelect.innerHTML = '<option>Cerrado los Domingos</option>';
                return;
            }

            // Horarios de toma de turnos solicitados: 7 a 17hs (L-V) y 7 a 12hs (Sáb)
            let inicio = 7;
            let fin = (diaSemana === 6) ? 12 : 17; 

            for (let h = inicio; h <= fin; h++) {
                let horaFormateada = (h < 10 ? '0' + h : h) + ':00 hs';
                let option = document.createElement('option');
                option.value = horaFormateada;
                option.text = horaFormateada;
                horaSelect.appendChild(option);
            }
        }

        function enviarTurno() {
            const tel = "59895738828";
            const servicio = document.getElementById('servicio').value;
            const fecha = document.getElementById('fecha').value;
            const hora = document.getElementById('hora').value;

            if (!fecha || !hora || hora.includes("Seleccione")) {
                alert("Por favor, selecciona una fecha y hora válida.");
                return;
            }

            const mensaje = `Hola Andres Armanetti, quiero agendar un turno:%0A%0A` +
                            `🛠 *Servicio:* ${servicio}%0A` +
                            `📅 *Fecha:* ${fecha}%0A` +
                            `⏰ *Hora:* ${hora}%0A%0A` +
                            `Confirmame disponibilidad por favor.`;

            window.open(`https://wa.me/${tel}?text=${mensaje}`, '_blank');
        }

        // Bloquear fechas anteriores a hoy
        const hoy = new Date().toISOString().split("T")[0];
        document.getElementById('fecha').setAttribute('min', hoy);
    </script>
</body>
</html>
